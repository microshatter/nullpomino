name: "Build"

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

# permissions:
#   contents: read

# env:
#   # Passed to every Maven invocation below
#   MVN_FLAGS: "-B --no-transfer-progress"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        working-directory: nullpomino-parent
        run: mvn $MVN_FLAGS install

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: NullpoMino
          path: nullpomino-run/target/install/
          if-no-files-found: error
