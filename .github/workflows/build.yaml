name: "Build"

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  idk_name:
    runs-on: ubuntu-latest
    name: idk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        working-directory: nullpomino-parent
        run: mvn $MVN_FLAGS install
